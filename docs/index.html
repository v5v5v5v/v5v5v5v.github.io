<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>好记性不如烂笔头</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"> -->
  <!-- 自定义样式 -->
  <link rel="stylesheet" href="./CSS/3.css">
  <!-- favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
</head>

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      // 项目名称
      name: '好记性不如烂笔头',
      // 侧边栏：加载根目录下的 _sidebar.md
      loadSidebar: true,
      // 定义路由别名，可以更自由的定义路由规则。 支持正则
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      // 小屏设备下合并导航栏到侧边栏
      mergeNavbar: true,
      // 自动提取当前页面的标题层级（2 表示提取 H1、H2 标题）
      subMaxLevel: 2,
      // 切换页面后是否自动跳转到页面顶部
      auto2top: true,
      // 搜索配置
      search: {
        // 索引过期时间，默认一天 (毫秒)
        maxAge: 86400000,
        paths: 'auto',
        // 搜索占位符文本
        placeholder: '搜索',
        // 搜索结果显示的最大数量
        maxResultLength: 100,
        // 是否启用模糊搜索
        fuzzySearch: true,
        // 搜索结果中是否显示文件路径
        showPath: true,
      },
      // MD文件更新时间插件配置
      timeUpdater: {
        text: "<div align='center' style='color:gray;font-size:16px;margin-top:60px;'>更新时间: {docsify-updated}</div>",
        formatUpdated: "{YYYY}年{MM}月{DD}号  {HH}:{mm}:{ss}",  // "YYYY-MM-DD HH:mm:ss" or "YYYY/MM/DD HH:mm:ss"
        whereToPlace: "bottom",  // "top" or "bottom"
      },
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- 代码块语法解析 -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-swift.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-git.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <!-- 搜索插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- 图片放大缩小（zoom-image） -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <!-- 代码块一键复制 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- MD文件更新时间 -->
  <script src="./JS/time-updater.min.js"></script>
  <!-- toc -->
  <script src="./JS/toc.js"></script>
</body>

</html>
